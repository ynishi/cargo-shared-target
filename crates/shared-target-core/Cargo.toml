[package]
name = "shared-target-core"
description = "Seeding a Cargo target directory from an existing one, sharing storage where the filesystem allows it"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["cargo", "target", "reflink", "hardlink", "build-cache"]
categories = [
    "development-tools::build-utils",
    "filesystem",
    "caching",
]
# Where the API of this crate is read. Derived from the crate name, which is
# what docs.rs builds from — not a choice about where anything is hosted.
documentation = "https://docs.rs/shared-target-core"

[dependencies]
filetime.workspace = true
reflink-copy.workspace = true
rustix.workspace = true
serde_json.workspace = true
thiserror.workspace = true
walkdir.workspace = true

[dev-dependencies]
# A crate's own dependencies are not in scope for its integration tests, and
# the fixture has to set the mtimes it then asserts about.
filetime.workspace = true
rustix.workspace = true
tempfile.workspace = true
walkdir.workspace = true
